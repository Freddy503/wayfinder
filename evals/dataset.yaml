# The eval dataset.
#
# Kept as one file rather than twenty, because it is uploaded to LangSmith as a
# single unit and edited as a single unit — splitting it across directories
# makes it harder to see the difficulty spread, which is the only property that
# actually matters here.
#
# A dataset where everything passes teaches you nothing. The spread below is
# deliberate: easy cases catch regressions, constraint-dense cases are where
# the repair loop earns its keep, and the infeasible cases are the ones that
# expose a bad agent — the correct answer there is `feasible: false`, and an
# agent that fabricates a plan instead scores zero on `correctly_refused` while
# looking perfectly healthy on every other metric.
#
# `should_refuse: true` is the reference output. It is stripped before the spec
# reaches the agent.

# ---------------------------------------------------------------- easy
- name: lisbon-easy
  category: easy
  spec:
    destination: Lisbon, Portugal
    dates: {start: 2026-10-12, end: 2026-10-14}
    party: {adults: 2}
    budget: {currency: EUR, total: 900, excludes: [flights, accommodation]}
    pace: relaxed
    constraints:
      earliest_start: "09:30"
      required_meals: [dinner]
    soft_preferences:
      - viewpoints over museums
      - neighbourhood restaurants over tourist-facing ones
    must_do: [Time Out Market]

