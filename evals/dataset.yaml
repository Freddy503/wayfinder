# ------------------------------------------------------- infeasible
# The correct answer is `feasible: false` with the conflict named. An agent
# that returns a plan here has ignored the spec, however good the plan looks.
- name: five-cities-six-days
  category: infeasible
  should_refuse: true
  spec:
    destination: Lisbon, Madrid, Barcelona, Rome and Athens
    dates: {start: 2026-06-01, end: 2026-06-06}
    party: {adults: 2}
    budget: {currency: EUR, total: 400, excludes: []}
    pace: relaxed
    constraints:
      max_transit_minutes: 30
      min_free_block_minutes: 180
      required_meals: [breakfast, lunch, dinner]
    soft_preferences: [see the major sights in each]

- name: paris-impossible-budget
  category: infeasible
  should_refuse: true
  spec:
