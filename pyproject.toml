[project]
name = "wayfinder"
version = "0.1.0"
description = "A constraint-solving trip planner built on LangChain Deep Agents, observed with LangSmith"
readme = "README.md"
authors = [
    { name = "Freddy503", email = "frederick.kuenstler@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.2",
    # Not used by this project — deepagents imports it at module scope, so
    # `create_deep_agent` fails to import without it. Nothing here builds a
    # ChatAnthropic (a test enforces that), and models.py refuses `anthropic:`
    # specs outright, so its presence cannot route a call to Anthropic.
    "langchain-anthropic>=1.0",
    "langsmith>=0.4",
    "openevals>=0.1",
    "typer>=0.15",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
wayfinder = "wayfinder.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
